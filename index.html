<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather API Client — Омаров Нурислам</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Погода по городам</h1>
    <p class="subtitle">Lab 6 — async, Promise, Fetch, REST. IT1-2310, Омаров Нурислам.</p>
    <p class="api-note">API: <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> (без ключа)</p>

    <!-- Состояние загрузки / ошибки для списка по умолчанию -->
    <section id="list-status" class="status" aria-live="polite"></section>
    <section id="city-list" class="card-grid"></section>

    <!-- 3. Поиск: уходит отдельный запрос (геокодинг), а не фильтр старого списка -->
    <section class="panel">
      <h2>Найти город</h2>
      <form id="search-form">
        <input type="text" id="search-input" placeholder="Например: Paris">
        <button type="submit">Искать</button>
      </form>
      <div id="search-status" class="status"></div>
      <ul id="search-results" class="results-list"></ul>
    </section>

    <!-- 4. Детальный просмотр одного города (второй запрос по координатам) -->
    <section id="detail-panel" class="panel detail-panel hidden">
      <button type="button" id="detail-back-btn">← Закрыть</button>
      <div id="detail-status" class="status"></div>
      <div id="detail-content"></div>
    </section>

    <!-- 5. Promise.all — два параллельных запроса -->
    <section class="panel">
      <h2>Сравнить погоду в двух городах (Promise.all)</h2>
      <form id="compare-form">
        <input type="text" id="compare-a" placeholder="Город 1" value="Алматы">
        <input type="text" id="compare-b" placeholder="Город 2" value="Астана">
        <button type="submit">Сравнить</button>
      </form>
      <div id="compare-status" class="status"></div>
      <div id="compare-result" class="card-grid"></div>
    </section>
  </main>

  <script src="src/app.js"></script>
</body>
</html>
